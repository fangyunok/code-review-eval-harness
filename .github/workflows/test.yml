name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -q
      - name: Build benchmark dataset
        run: |
          python -m code_review_eval.datasets.pipeline --output data/benchmark.jsonl --synthetic 200
      - name: Run offline demo
        run: |
          python demo.py
