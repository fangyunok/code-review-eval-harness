[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-eval-harness"
version = "0.2.0"
description = "代码评审 Agent 双层评测框架：评测集管线 + Harness 层 + Model 层对齐打分 + 异步并发 + 质量门禁"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fangyunok" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
embeddings = ["sentence-transformers>=2.2"]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
creh = "code_review_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_review_eval = ["echarts.min.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = false
